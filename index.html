<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise!</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0;
            background: #000; 
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1); /* Mirrors front camera */
            z-index: 1;
        } 

        /* The Message Banner */
        .love-message {
            position: absolute;
            top: 15%;
            background: rgba(255, 20, 147, 0.9); /* Vibrant Hot Pink */
            color: white;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 2px solid white;
            z-index: 10;
            
            /* Animation States */
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .love-message.show {
            opacity: 0.5;
            transform: scale(1);
        }

        /* The Kiss Emoji Overlay */
        .kiss-overlay {
            position: absolute;
            font-size: 9rem; 
            z-index: 5;
            pointer-events: none;
            
            /* Animation States */
            opacity: 0;
            transform: scale(0.1);
            transition: opacity 3s linear, transform 3s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .kiss-overlay.grow {
            opacity: 1;
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <video id="mirror" autoplay playsinline muted></video>
        
        <div class="love-message" id="loveMsg"> Message </div>
        <div class="kiss-overlay" id="kissEmoji"> OVERLAY</div>
    </div>

    <script>
        const videoElement = document.getElementById('mirror');
        const loveMsg = document.getElementById('loveMsg');
        const kissEmoji = document.getElementById('kissEmoji');

        // Function to trigger our visual effects
        function triggerSurprise() {
            // Step 1: Pop up the text message instantly
            loveMsg.classList.add('show');

            // Step 2: Start forming the kiss emoji right in the center
            // It will take a full 3 seconds to fully grow
            kissEmoji.classList.add('grow');
        }

        // Request front camera access explicitly
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(function(stream) {
                videoElement.srcObject = stream;
                
                // Extra failsafe configurations for mobile browsers
                videoElement.setAttribute('autoplay', '');
                videoElement.setAttribute('muted', '');
                videoElement.setAttribute('playsinline', '');

                // Failsafe: Trigger the animation 1 second after the stream is accepted,
                // regardless of what events the device's native browser supports.
                setTimeout(triggerSurprise, 1000);
            })
            .catch(function(err) {
                console.log("Error loading camera stream: " + err);
                document.body.innerHTML = "<h2 style='padding:40px; text-align:center; color: #ff1493;'>Please allow camera access to see your surprise! 💕</h2>";
            });
    </script>
</body>
</html>
